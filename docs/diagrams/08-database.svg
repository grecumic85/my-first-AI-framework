<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="UML sequence: fresh database observations"><title>UML sequence: fresh database observations</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#466681"/></marker><marker id="triangle" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="white" stroke="#466681"/></marker><marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto"><path d="M0,5 L6,0 L12,5 L6,10 Z" fill="#466681"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#19354e;font-size:15px}.title{font-size:24px;font-weight:650}.head{font-size:17px;font-weight:600}.small{font-size:13px}.node{fill:#f1f6fb;stroke:#7294af;stroke-width:1.4}.edge{fill:none;stroke:#466681;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text class="title" x="28" y="38">UML sequence: fresh database observations</text><rect class="node" x="2" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="50" y="103">Scenario</text><path class="edge" stroke-dasharray="5 5" d="M50,120 V695"/><rect class="node" x="277" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="325" y="103">Repository</text><path class="edge" stroke-dasharray="5 5" d="M325,120 V695"/><rect class="node" x="552" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="600" y="103">Poll</text><path class="edge" stroke-dasharray="5 5" d="M600,120 V695"/><rect class="node" x="827" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="875" y="103">Factory</text><path class="edge" stroke-dasharray="5 5" d="M875,120 V695"/><rect class="node" x="1102" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="1150" y="103">Context</text><path class="edge" stroke-dasharray="5 5" d="M1150,120 V695"/><path class="edge"  d="M50,162 H325" marker-end="url(#arrow)"/><rect x="58" y="139" width="259" height="20" fill="white"/><text class="small" x="60" y="154">WaitForAsync(predicate, timeout)</text><path class="edge"  d="M325,232 H600" marker-end="url(#arrow)"/><rect x="333" y="209" width="259" height="20" fill="white"/><text class="small" x="335" y="224">repeat observation until matching row</text><path class="edge"  d="M600,302 H875" marker-end="url(#arrow)"/><rect x="608" y="279" width="259" height="20" fill="white"/><text class="small" x="610" y="294">create context for each observation</text><path class="edge"  d="M875,372 H1150" marker-end="url(#arrow)"/><rect x="883" y="349" width="259" height="20" fill="white"/><text class="small" x="885" y="364">new EF context</text><path class="edge"  d="M600,442 H1150" marker-end="url(#arrow)"/><rect x="608" y="419" width="534" height="20" fill="white"/><text class="small" x="610" y="434">AsNoTracking + predicate + FirstOrDefaultAsync</text><path class="edge" stroke-dasharray="5 5" d="M1150,512 H600" marker-end="url(#arrow)"/><rect x="608" y="489" width="534" height="20" fill="white"/><text class="small" x="610" y="504">detached row or null; dispose context</text><path class="edge"  d="M600,582 h35 v24 h-35" marker-end="url(#arrow)"/><rect x="608" y="559" width="380" height="20" fill="white"/><text class="small" x="610" y="574">no row -&gt; cancellable delay -&gt; fresh context</text><path class="edge" stroke-dasharray="5 5" d="M600,652 H50" marker-end="url(#arrow)"/><rect x="58" y="629" width="534" height="20" fill="white"/><text class="small" x="60" y="644">matching row or timeout/cancellation</text></svg>
