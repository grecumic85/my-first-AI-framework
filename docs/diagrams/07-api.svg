<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-label="UML sequence: generated API runtime"><title>UML sequence: generated API runtime</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#466681"/></marker><marker id="triangle" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="white" stroke="#466681"/></marker><marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto"><path d="M0,5 L6,0 L12,5 L6,10 Z" fill="#466681"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#19354e;font-size:15px}.title{font-size:24px;font-weight:650}.head{font-size:17px;font-weight:600}.small{font-size:13px}.node{fill:#f1f6fb;stroke:#7294af;stroke-width:1.4}.edge{fill:none;stroke:#466681;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text class="title" x="28" y="38">UML sequence: generated API runtime</text><rect class="node" x="2" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="50" y="103">Scenario</text><path class="edge" stroke-dasharray="5 5" d="M50,120 V905"/><rect class="node" x="262" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="310" y="103">Generated</text><path class="edge" stroke-dasharray="5 5" d="M310,120 V905"/><rect class="node" x="522" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="570" y="103">Audit</text><path class="edge" stroke-dasharray="5 5" d="M570,120 V905"/><rect class="node" x="782" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="830" y="103">Retry</text><path class="edge" stroke-dasharray="5 5" d="M830,120 V905"/><rect class="node" x="1042" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="1090" y="103">Bearer</text><path class="edge" stroke-dasharray="5 5" d="M1090,120 V905"/><rect class="node" x="1302" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="1350" y="103">Transport</text><path class="edge" stroke-dasharray="5 5" d="M1350,120 V905"/><path class="edge"  d="M50,162 H310" marker-end="url(#arrow)"/><rect x="58" y="139" width="244" height="20" fill="white"/><text class="small" x="60" y="154">call generated method with DTO + cancellation</text><path class="edge"  d="M310,232 H570" marker-end="url(#arrow)"/><rect x="318" y="209" width="244" height="20" fill="white"/><text class="small" x="320" y="224">send HttpRequestMessage through injected HttpClient</text><path class="edge"  d="M570,302 H830" marker-end="url(#arrow)"/><rect x="578" y="279" width="244" height="20" fill="white"/><text class="small" x="580" y="294">start logical-request timer</text><path class="edge"  d="M830,372 H1090" marker-end="url(#arrow)"/><rect x="838" y="349" width="244" height="20" fill="white"/><text class="small" x="840" y="364">send attempt; only bodyless GET/HEAD can retry</text><path class="edge"  d="M1090,442 h35 v24 h-35" marker-end="url(#arrow)"/><rect x="1098" y="419" width="380" height="20" fill="white"/><text class="small" x="1100" y="434">get cached token or acquire through provider</text><path class="edge"  d="M1090,512 H1350" marker-end="url(#arrow)"/><rect x="1098" y="489" width="244" height="20" fill="white"/><text class="small" x="1100" y="504">attach bearer when configured; send</text><path class="edge" stroke-dasharray="5 5" d="M1350,582 H830" marker-end="url(#arrow)"/><rect x="838" y="559" width="504" height="20" fill="white"/><text class="small" x="840" y="574">response or transport failure</text><path class="edge"  d="M830,652 h35 v24 h-35" marker-end="url(#arrow)"/><rect x="838" y="629" width="380" height="20" fill="white"/><text class="small" x="840" y="644">bounded retry if eligible; dispose transient response</text><path class="edge" stroke-dasharray="5 5" d="M830,722 H570" marker-end="url(#arrow)"/><rect x="578" y="699" width="244" height="20" fill="white"/><text class="small" x="580" y="714">final response</text><path class="edge" stroke-dasharray="5 5" d="M570,792 H310" marker-end="url(#arrow)"/><rect x="318" y="769" width="244" height="20" fill="white"/><text class="small" x="320" y="784">record status / elapsed metadata</text><path class="edge" stroke-dasharray="5 5" d="M310,862 H50" marker-end="url(#arrow)"/><rect x="58" y="839" width="244" height="20" fill="white"/><text class="small" x="60" y="854">deserialize DTO or throw typed API exception</text></svg>
