<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="UML sequence: selecting an exact calendar date"><title>UML sequence: selecting an exact calendar date</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#466681"/></marker><marker id="triangle" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="white" stroke="#466681"/></marker><marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto"><path d="M0,5 L6,0 L12,5 L6,10 Z" fill="#466681"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#19354e;font-size:15px}.title{font-size:24px;font-weight:650}.head{font-size:17px;font-weight:600}.small{font-size:13px}.node{fill:#f1f6fb;stroke:#7294af;stroke-width:1.4}.edge{fill:none;stroke:#466681;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text class="title" x="28" y="38">UML sequence: selecting an exact calendar date</text><rect class="node" x="2" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="50" y="103">Scenario</text><path class="edge" stroke-dasharray="5 5" d="M50,120 V975"/><rect class="node" x="270" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="318" y="103">SitePage</text><path class="edge" stroke-dasharray="5 5" d="M318,120 V975"/><rect class="node" x="538" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="586" y="103">Navigator</text><path class="edge" stroke-dasharray="5 5" d="M586,120 V975"/><rect class="node" x="806" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="854" y="103">Calendar</text><path class="edge" stroke-dasharray="5 5" d="M854,120 V975"/><rect class="node" x="1074" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="1122" y="103">Wait</text><path class="edge" stroke-dasharray="5 5" d="M1122,120 V975"/><rect class="node" x="1342" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="1390" y="103">Browser</text><path class="edge" stroke-dasharray="5 5" d="M1390,120 V975"/><path class="edge"  d="M50,162 H318" marker-end="url(#arrow)"/><rect x="58" y="139" width="252" height="20" fill="white"/><text class="small" x="60" y="154">open site / choose widget and iframe</text><path class="edge"  d="M318,232 H854" marker-end="url(#arrow)"/><rect x="326" y="209" width="520" height="20" fill="white"/><text class="small" x="328" y="224">configure header, arrows and full-date locator</text><path class="edge"  d="M50,302 H586" marker-end="url(#arrow)"/><rect x="58" y="279" width="520" height="20" fill="white"/><text class="small" x="60" y="294">Select(calendar, targetDate)</text><path class="edge"  d="M586,372 H854" marker-end="url(#arrow)"/><rect x="594" y="349" width="252" height="20" fill="white"/><text class="small" x="596" y="364">read displayed month; enforce distance budget</text><path class="edge"  d="M586,442 H854" marker-end="url(#arrow)"/><rect x="594" y="419" width="252" height="20" fill="white"/><text class="small" x="596" y="434">MoveMonth(sign) for each required step</text><path class="edge"  d="M854,512 H1122" marker-end="url(#arrow)"/><rect x="862" y="489" width="252" height="20" fill="white"/><text class="small" x="864" y="504">wait for arrow readiness; click once</text><path class="edge"  d="M1122,582 H1390" marker-end="url(#arrow)"/><rect x="1130" y="559" width="252" height="20" fill="white"/><text class="small" x="1132" y="574">native click and header observations</text><path class="edge" stroke-dasharray="5 5" d="M854,652 H586" marker-end="url(#arrow)"/><rect x="594" y="629" width="252" height="20" fill="white"/><text class="small" x="596" y="644">expected adjacent month reached</text><path class="edge"  d="M586,722 H854" marker-end="url(#arrow)"/><rect x="594" y="699" width="252" height="20" fill="white"/><text class="small" x="596" y="714">ClickDay(targetDate) in target month</text><path class="edge"  d="M854,792 H1390" marker-end="url(#arrow)"/><rect x="862" y="769" width="520" height="20" fill="white"/><text class="small" x="864" y="784">native click on fully qualified date cell</text><path class="edge"  d="M50,862 H318" marker-end="url(#arrow)"/><rect x="58" y="839" width="252" height="20" fill="white"/><text class="small" x="60" y="854">assert committed value / range status</text><path class="edge"  d="M318,932 H1122" marker-end="url(#arrow)"/><rect x="326" y="909" width="788" height="20" fill="white"/><text class="small" x="328" y="924">wait for exact business result</text></svg>
