<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="580" viewBox="0 0 1050 580" role="img" aria-label="State model: Lastest two-click range"><title>State model: Lastest two-click range</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#466681" /></marker><marker id="triangle" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="white" stroke="#466681" /></marker><marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto"><path d="M0,5 L6,0 L12,5 L6,10 Z" fill="#466681" /></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#19354e;font-size:15px}.title{font-size:24px;font-weight:650}.head{font-size:17px;font-weight:600}.small{font-size:13px}.node{fill:#f1f6fb;stroke:#7294af;stroke-width:1.4}.edge{fill:none;stroke:#466681;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white" /><text class="title" x="28" y="38">State model: Lastest two-click range</text><path class="edge" d="M370,140 L650,157.5" marker-end="url(#arrow)" /><rect x="460.5" y="134.75" width="99" height="19" fill="white" /><text class="small" text-anchor="middle" x="510" y="148.75">first weekday</text><path class="edge" d="M815,225 L815,395" marker-end="url(#arrow)" /><rect x="765.5" y="296" width="99" height="19" fill="white" /><text class="small" text-anchor="middle" x="815" y="310">later weekday</text><path class="edge" d="M815,395 L215,190" marker-end="url(#arrow)" /><rect x="493.5" y="283.5" width="43" height="19" fill="white" /><text class="small" text-anchor="middle" x="515" y="297.5">Reset</text><path class="edge" d="M650,157.5 L370,140" marker-end="url(#arrow)" /><rect x="488.5" y="134.75" width="43" height="19" fill="white" /><text class="small" text-anchor="middle" x="510" y="148.75">Reset</text><rect class="node" x="60" y="90" width="310" height="100" rx="10" /><text class="head" text-anchor="middle" x="215" y="118">No selection</text><text x="75" y="149">Status: select check-in</text><text x="75" y="172">Reset returns here</text><rect class="node" x="650" y="90" width="330" height="135" rx="10" /><text class="head" text-anchor="middle" x="815" y="118">Check-in selected</text><text x="665" y="149">First eligible day becomes start</text><text x="665" y="172">Earlier second click replaces start</text><text x="665" y="195">Status asks for check-out</text><rect class="node" x="650" y="395" width="330" height="110" rx="10" /><text class="head" text-anchor="middle" x="815" y="423">Range complete</text><text x="665" y="454">Later second click becomes end</text><text x="665" y="477">Nights = end.DayNumber - start</text><rect class="node" x="60" y="395" width="310" height="110" rx="10" /><text class="head" text-anchor="middle" x="215" y="423">Disabled weekend</text><text x="75" y="454">Cannot select via normal UI</text><text x="75" y="477">Availability verified before selection</text></svg>