<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="860" viewBox="0 0 1250 860" role="img" aria-label="UML sequence: test result and cleanup"><title>UML sequence: test result and cleanup</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#466681"/></marker><marker id="triangle" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="white" stroke="#466681"/></marker><marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto"><path d="M0,5 L6,0 L12,5 L6,10 Z" fill="#466681"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#19354e;font-size:15px}.title{font-size:24px;font-weight:650}.head{font-size:17px;font-weight:600}.small{font-size:13px}.node{fill:#f1f6fb;stroke:#7294af;stroke-width:1.4}.edge{fill:none;stroke:#466681;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text class="title" x="28" y="38">UML sequence: test result and cleanup</text><rect class="node" x="2" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="50" y="103">Runner</text><path class="edge" stroke-dasharray="5 5" d="M50,120 V835"/><rect class="node" x="289.5" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="337.5" y="103">TestScope</text><path class="edge" stroke-dasharray="5 5" d="M337.5,120 V835"/><rect class="node" x="577" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="625" y="103">Browser</text><path class="edge" stroke-dasharray="5 5" d="M625,120 V835"/><rect class="node" x="864.5" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="912.5" y="103">Cleanup</text><path class="edge" stroke-dasharray="5 5" d="M912.5,120 V835"/><rect class="node" x="1152" y="75" width="96" height="45" rx="4"/><text class="small" text-anchor="middle" x="1200" y="103">Result</text><path class="edge" stroke-dasharray="5 5" d="M1200,120 V835"/><path class="edge"  d="M50,162 H337.5" marker-end="url(#arrow)"/><rect x="58" y="139" width="271.5" height="20" fill="white"/><text class="small" x="60" y="154">construct scope; browser starts lazily</text><path class="edge"  d="M50,232 H625" marker-end="url(#arrow)"/><rect x="58" y="209" width="559" height="20" fill="white"/><text class="small" x="60" y="224">execute page action and assertions</text><path class="edge"  d="M50,302 H337.5" marker-end="url(#arrow)"/><rect x="58" y="279" width="271.5" height="20" fill="white"/><text class="small" x="60" y="294">CompleteAsync(outcome)</text><path class="edge"  d="M337.5,372 H625" marker-end="url(#arrow)"/><rect x="345.5" y="349" width="271.5" height="20" fill="white"/><text class="small" x="347.5" y="364">if failed: capture screenshot and page HTML</text><path class="edge"  d="M337.5,442 H912.5" marker-end="url(#arrow)"/><rect x="345.5" y="419" width="559" height="20" fill="white"/><text class="small" x="347.5" y="434">dispose: callbacks in reverse registration order</text><path class="edge" stroke-dasharray="5 5" d="M912.5,512 H337.5" marker-end="url(#arrow)"/><rect x="345.5" y="489" width="559" height="20" fill="white"/><text class="small" x="347.5" y="504">collect failures; continue remaining callbacks</text><path class="edge"  d="M337.5,582 H625" marker-end="url(#arrow)"/><rect x="345.5" y="559" width="271.5" height="20" fill="white"/><text class="small" x="347.5" y="574">dispose every owned driver</text><path class="edge"  d="M337.5,652 h35 v24 h-35" marker-end="url(#arrow)"/><rect x="345.5" y="629" width="380" height="20" fill="white"/><text class="small" x="347.5" y="644">dispose API and token resources</text><path class="edge"  d="M337.5,722 H1200" marker-end="url(#arrow)"/><rect x="345.5" y="699" width="846.5" height="20" fill="white"/><text class="small" x="347.5" y="714">write result; cleanup failure means Failed</text><path class="edge" stroke-dasharray="5 5" d="M337.5,792 H50" marker-end="url(#arrow)"/><rect x="58" y="769" width="271.5" height="20" fill="white"/><text class="small" x="60" y="784">surface cleanup failure when present</text></svg>
