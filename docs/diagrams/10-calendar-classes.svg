<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="760" viewBox="0 0 1090 760" role="img" aria-label="UML classes: reusable calendar navigation"><title>UML classes: reusable calendar navigation</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#466681" /></marker><marker id="triangle" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="white" stroke="#466681" /></marker><marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto"><path d="M0,5 L6,0 L12,5 L6,10 Z" fill="#466681" /></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#19354e;font-size:15px}.title{font-size:24px;font-weight:650}.head{font-size:17px;font-weight:600}.small{font-size:13px}.node{fill:#f1f6fb;stroke:#7294af;stroke-width:1.4}.edge{fill:none;stroke:#466681;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white" /><text class="title" x="28" y="38">UML classes: reusable calendar navigation</text><path class="edge" d="M390,147.5 L580,147.5" stroke-dasharray="6 4" marker-end="url(#arrow)" /><rect x="446" y="133.5" width="78" height="19" fill="white" /><text class="small" text-anchor="middle" x="485" y="147.5">depends on</text><path class="edge" d="M545,340 L765,215" stroke-dasharray="6 4" marker-end="url(#triangle)" /><rect x="616" y="263.5" width="78" height="19" fill="white" /><text class="small" text-anchor="middle" x="655" y="277.5">implements</text><path class="edge" d="M920,340 L765,215" stroke-dasharray="6 4" marker-end="url(#triangle)" /><rect x="800" y="263.5" width="85" height="19" fill="white" /><text class="small" text-anchor="middle" x="842.5" y="277.5">test double</text><path class="edge" d="M170,340 L210,215" marker-end="url(#arrow)" /><rect x="172" y="263.5" width="36" height="19" fill="white" /><text class="small" text-anchor="middle" x="190" y="277.5">uses</text><path class="edge" d=