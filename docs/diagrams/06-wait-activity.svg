xt><text x="370" y="297">Other errors -&gt; fail</text><rect class="node" x="355" y="395" width="330" height="135" rx="10" /><text class="head" text-anchor="middle" x="520" y="423">Check readiness</text><text x="370" y="454">Visible + enabled + positive box</text><text x="370" y="477">Center hit-test unobscured</text><text x="370" y="500">Bounding rectangle stable</text><rect class="node" x="20" y="395" width="260" height="110" rx="10" /><text class="head" text-anchor="middle" x="150" y="423">Not ready</text><text x="35" y="454">Deadline not elapsed: poll</text><text x="35" y="477">Deadline elapsed: timeout</text><rect class="node" x="355" y="625" width="330" height="85" rx="10" /><text class="head" text-anchor="middle" x="520" y="653">Perform one WebDriver click</text><text x="370" y="684">Return or surface click failure</text></svg>