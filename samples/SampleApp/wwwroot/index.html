<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Automation starter sample</title>
<style>body{max-width:720px;margin:60px auto;font:18px system-ui}input,button{font:inherit;padding:10px}li{padding:12px}#loading[hidden]{display:none}</style></head>
<body><h1 data-testid="page-title">Automation sample</h1>
<form id="form"><label>Item name <input data-testid="item-name" id="name" required></label><button data-testid="add-item">Add item</button></form>
<p id="loading" data-testid="loading" hidden>Loadingâ€¦</p><p id="error" role="alert"></p><ul data-testid="items" id="items"></ul>
<a href="/download" data-testid="download">Download sample CSV</a>
<script>
async function load(){const items=await(await fetch('/api/items')).json();const list=document.querySelector('#items');list.replaceChildren();for(const item of items){const li=document.createElement('li');li.dataset.testid='item';li.textContent=item.name;list.append(li);}}
document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();document.querySelector('#loading').hidden=false;
try{const response=await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value})});if(!response.ok)throw Error('Create failed');await load();}catch(error){document.querySelector('#error').textContent=error.message;}finally{document.querySelector('#loading').hidden=true;}});
load();
</script></body></html>
